services:
  # Applies Prisma migrations, then exits. Also used for seeding:
  #   docker compose run --rm migrate npx prisma db seed
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    command: npx prisma migrate deploy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
